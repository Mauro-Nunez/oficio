services:
  php:
    image: oficio-php:latest
    container_name: oficio_php
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://gustavo:12345678@database:3306/oficio?serverVersion=8.0"
      APP_ENV: "prod"
      APP_DEBUG: "0"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - oficio-network

  nginx:
    image: nginx:alpine
    container_name: oficio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - oficio-network

  database:
    image: mysql:8.0
    container_name: oficio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: oficio
      MYSQL_USER: gustavo
      MYSQL_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - oficio-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gustavo", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  oficio-network:
    driver: bridge

volumes:
  db_data: