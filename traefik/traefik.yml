# Traefik static configuration
api:
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: oficiosgarupa.com.ar
            sans:
              - www.oficiosgarupa.com.ar

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-network
  file:
    filename: /etc/traefik/dynamic_conf.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: registrodeoficios.ar@gmail.com  # Change this to your actual email
      storage: /acme.json
      httpChallenge:
        entryPoint: web
      # Uncomment for production
      caServer: https://acme-v02.api.letsencrypt.org/directory
      # Comment out for production (this is for testing)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100